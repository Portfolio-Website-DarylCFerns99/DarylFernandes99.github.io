<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseBroker {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.15); filter: brightness(1.3); }
    }
    .orbit-ring {
      transform-origin: 200px 90px;
      animation: spin 15s infinite linear;
    }
    .broker {
      transform-origin: 200px 90px;
      animation: pulseBroker 3s infinite ease-in-out;
      fill: #4f46e5;
    }
    .service-node {
      fill: #1e293b;
      stroke: #6366f1;
      stroke-width: 2;
    }
    .text {
      font-family: 'JetBrains Mono', monospace, Courier;
      font-size: 13px;
      fill: #6366f1;
      font-weight: bold;
    }
  </style>

  <!-- Central Broker Node -->
  <circle cx="200" cy="90" r="18" class="broker" />
  <circle cx="200" cy="90" r="12" fill="#818cf8" />
  <circle cx="200" cy="90" r="6" fill="#fff" />

  <!-- Outer orbiting systems -->
  <g class="orbit-ring">
    <!-- Orbit line -->
    <circle cx="200" cy="90" r="60" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1.5" stroke-dasharray="5 5" fill="none" />

    <!-- Connection beams (Lines from center to orbiting nodes) -->
    <line x1="200" y1="90" x2="200" y2="30" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />
    <line x1="200" y1="90" x2="200" y2="150" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />
    <line x1="200" y1="90" x2="140" y2="90" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />
    <line x1="200" y1="90" x2="260" y2="90" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />

    <!-- Node 1 (Top) -->
    <circle cx="200" cy="30" r="10" class="service-node" />
    <circle cx="200" cy="30" r="4" fill="#ef4444" />

    <!-- Node 2 (Right) -->
    <circle cx="260" cy="90" r="10" class="service-node" />
    <circle cx="260" cy="90" r="4" fill="#10b981" />

    <!-- Node 3 (Bottom) -->
    <circle cx="200" cy="150" r="10" class="service-node" />
    <circle cx="200" cy="150" r="4" fill="#3b82f6" />

    <!-- Node 4 (Left) -->
    <circle cx="140" cy="90" r="10" class="service-node" />
    <circle cx="140" cy="90" r="4" fill="#f59e0b" />
  </g>

  <!-- Loading text -->
  <text x="200" y="180" class="text" text-anchor="middle">ORCHESTRATING MICROSERVICES...</text>
</svg>