<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.1); filter: brightness(1.3); }
    }
    @keyframes flow {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }
    .neuron {
      transform-origin: center;
      animation: pulse 3s infinite ease-in-out;
    }
    .delay-1 { animation-delay: 0.5s; }
    .delay-2 { animation-delay: 1s; }
    .delay-3 { animation-delay: 1.5s; }
    
    .conn-line {
      stroke: #818cf8;
      stroke-dasharray: 8 4;
      animation: flow 1.5s infinite linear;
    }
    .text {
      font-family: 'JetBrains Mono', monospace, Courier;
      font-size: 13px;
      fill: #4f46e5;
      font-weight: bold;
    }
  </style>

  <defs>
    <linearGradient id="grad-in" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-hidden" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="grad-out" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Network Connections -->
  <path d="M 80 60 L 160 50 M 80 60 L 160 90 M 80 60 L 160 130" class="conn-line" stroke-width="1.5" />
  <path d="M 80 110 L 160 50 M 80 110 L 160 90 M 80 110 L 160 130" class="conn-line" stroke-width="1.5" style="animation-delay: 0.3s;" />
  
  <path d="M 160 50 L 240 50 M 160 50 L 240 110" class="conn-line" stroke-width="1.5" style="animation-delay: 0.6s;" />
  <path d="M 160 90 L 240 50 M 160 90 L 240 110" class="conn-line" stroke-width="1.5" style="animation-delay: 0.9s;" />
  <path d="M 160 130 L 240 50 M 160 130 L 240 110" class="conn-line" stroke-width="1.5" style="animation-delay: 1.2s;" />
  
  <path d="M 240 50 L 320 80 Q 280 80 240 50" class="conn-line" stroke-width="1.5" style="animation-delay: 1.5s;" />
  <path d="M 240 110 L 320 80 Q 280 80 240 110" class="conn-line" stroke-width="1.5" style="animation-delay: 1.8s;" />

  <!-- Input Layer Nodes -->
  <circle cx="80" cy="60" r="10" class="neuron" fill="url(#grad-in)" />
  <circle cx="80" cy="110" r="10" class="neuron delay-1" fill="url(#grad-in)" />

  <!-- Hidden Layer Nodes -->
  <circle cx="160" cy="50" r="12" class="neuron delay-2" fill="url(#grad-hidden)" />
  <circle cx="160" cy="90" r="12" class="neuron delay-3" fill="url(#grad-hidden)" />
  <circle cx="160" cy="130" r="12" class="neuron delay-1" fill="url(#grad-hidden)" />

  <!-- Output Layer Nodes -->
  <circle cx="240" cy="50" r="12" class="neuron delay-3" fill="url(#grad-hidden)" />
  <circle cx="240" cy="110" r="12" class="neuron delay-2" fill="url(#grad-hidden)" />

  <!-- Final Node -->
  <circle cx="320" cy="80" r="14" class="neuron delay-1" fill="url(#grad-out)" />

  <!-- Text -->
  <text x="200" y="175" class="text" text-anchor="middle">TRAINING AI MODEL...</text>
</svg>