<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes orbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes databasePulse {
      0%, 100% { fill: #0891b2; }
      50% { fill: #22d3ee; }
    }
    .main-cloud {
      animation: float 4s infinite ease-in-out;
      fill: #e2e8f0;
      stroke: #cbd5e1;
      stroke-width: 2;
    }
    .spinning-gear {
      transform-origin: 200px 90px;
      animation: orbit 12s infinite linear;
    }
    .db-pulse {
      animation: databasePulse 2s infinite ease-in-out;
    }
    .text {
      font-family: 'JetBrains Mono', monospace, Courier;
      font-size: 13px;
      fill: #0284c7;
      font-weight: bold;
    }
  </style>

  <!-- Background Orbit Path -->
  <circle cx="200" cy="90" r="75" stroke="rgba(2, 132, 199, 0.15)" stroke-width="2" fill="none" stroke-dasharray="6 6" class="spinning-gear" />

  <!-- Cloud Node 1 (Left) -->
  <g transform="translate(100, 75)" style="opacity: 0.8;">
    <circle cx="10" cy="10" r="15" fill="#bae6fd" />
    <circle cx="25" cy="5" r="18" fill="#bae6fd" />
    <circle cx="40" cy="12" r="14" fill="#bae6fd" />
    <rect x="10" y="10" width="30" height="15" fill="#bae6fd" />
  </g>

  <!-- Cloud Node 2 (Right) -->
  <g transform="translate(240, 75)" style="opacity: 0.8;">
    <circle cx="10" cy="10" r="14" fill="#bae6fd" />
    <circle cx="25" cy="5" r="18" fill="#bae6fd" />
    <circle cx="40" cy="12" r="15" fill="#bae6fd" />
    <rect x="10" y="10" width="30" height="15" fill="#bae6fd" />
  </g>

  <!-- Main Central Cloud System -->
  <g class="main-cloud" transform="translate(130, 45)">
    <!-- Central Cloud Shape -->
    <path d="M40 70 A 25 25 0 0 1 65 35 A 35 35 0 0 1 125 40 A 25 25 0 0 1 150 70 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="2.5" />
    <rect x="40" y="60" width="110" height="18" fill="#bae6fd" />
    <line x1="40" y1="78" x2="150" y2="78" stroke="#0284c7" stroke-width="2.5" />
    
    <!-- Nested Storage Database Cylinder -->
    <g transform="translate(80, 45)">
      <ellipse cx="15" cy="5" rx="12" ry="4" class="db-pulse" />
      <path d="M3,5 A12,4 0 0,0 27,5 L27,14 A12,4 0 0,1 3,14 Z" class="db-pulse" style="animation-delay: 0.5s;" />
      <path d="M3,14 A12,4 0 0,0 27,14 L27,23 A12,4 0 0,1 3,23 Z" class="db-pulse" style="animation-delay: 1s;" />
    </g>
  </g>

  <!-- Uplink beam dots -->
  <circle cx="125" cy="120" r="4" fill="#0284c7" style="animation: float 2s infinite ease-in-out;" />
  <circle cx="275" cy="120" r="4" fill="#0284c7" style="animation: float 2s infinite ease-in-out; animation-delay: 0.5s;" />

  <!-- Loading text -->
  <text x="200" y="175" class="text" text-anchor="middle">PROVISIONING CLOUD SYSTEMS...</text>
</svg>