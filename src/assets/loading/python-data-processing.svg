<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <style>
    @keyframes parseData {
      0% { transform: scaleY(0.3); opacity: 0.5; }
      50% { transform: scaleY(1); opacity: 1; }
      100% { transform: scaleY(0.3); opacity: 0.5; }
    }
    @keyframes slideArray {
      0% { transform: translateX(-15px); }
      100% { transform: translateX(15px); }
    }
    .bar {
      transform-origin: bottom;
      animation: parseData 2.5s infinite ease-in-out;
      fill: #ffd43b;
    }
    .bar-delay-1 { animation-delay: 0.3s; fill: #3572a5; }
    .bar-delay-2 { animation-delay: 0.6s; fill: #ffd43b; }
    .bar-delay-3 { animation-delay: 0.9s; fill: #3572a5; }
    
    .sliding-stream {
      animation: slideArray 2s infinite alternate ease-in-out;
    }
    .text {
      font-family: 'JetBrains Mono', monospace, Courier;
      font-size: 13px;
      fill: #3572a5;
      font-weight: bold;
    }
  </style>

  <!-- Python logo background (abstract) -->
  <g transform="translate(180, 45)" style="opacity: 0.15;">
    <!-- Blue snake -->
    <path d="M 20 0 L 20 15 A 15 15 0 0 0 35 30 L 50 30 A 5 5 0 0 1 55 35 L 55 50 A 15 15 0 0 1 40 65 L 20 65" fill="none" stroke="#3572a5" stroke-width="12" stroke-linecap="round" />
    <!-- Yellow snake -->
    <path d="M 20 65 L 20 50 A 15 15 0 0 0 5 35 L -10 35 A 5 5 0 0 1 -15 30 L -15 15 A 15 15 0 0 1 0 0 L 20 0" fill="none" stroke="#ffd43b" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Data Matrix / Array grids (Left side) -->
  <g transform="translate(70, 60)">
    <rect x="0" y="0" width="80" height="60" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <g class="sliding-stream">
      <circle cx="15" cy="15" r="4" fill="#3572a5" />
      <circle cx="30" cy="15" r="4" fill="#ffd43b" />
      <circle cx="45" cy="15" r="4" fill="#3572a5" />
      <circle cx="60" cy="15" r="4" fill="#ffd43b" />
      
      <circle cx="15" cy="30" r="4" fill="#ffd43b" />
      <circle cx="30" cy="30" r="4" fill="#3572a5" />
      <circle cx="45" cy="30" r="4" fill="#ffd43b" />
      <circle cx="60" cy="30" r="4" fill="#3572a5" />

      <circle cx="15" cy="45" r="4" fill="#3572a5" />
      <circle cx="30" cy="45" r="4" fill="#ffd43b" />
      <circle cx="45" cy="45" r="4" fill="#3572a5" />
      <circle cx="60" cy="45" r="4" fill="#ffd43b" />
    </g>
  </g>

  <!-- Data Transformation arrow -->
  <path d="M 175 90 L 210 90 M 200 83 L 210 90 L 200 97" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Processed Output Graph (Right side) -->
  <g transform="translate(240, 60)">
    <rect x="0" y="0" width="90" height="60" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    
    <!-- Plot Bars -->
    <rect x="15" y="15" width="10" height="35" class="bar" />
    <rect x="32" y="15" width="10" height="35" class="bar bar-delay-1" />
    <rect x="49" y="15" width="10" height="35" class="bar bar-delay-2" />
    <rect x="66" y="15" width="10" height="35" class="bar bar-delay-3" />
  </g>

  <!-- Loading text -->
  <text x="200" y="175" class="text" text-anchor="middle">PROCESSING NUMPY ARRAYS...</text>
</svg>