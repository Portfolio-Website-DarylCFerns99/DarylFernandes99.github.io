<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <style>
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pulseCircle {
      0% { r: 35; opacity: 0.1; }
      50% { r: 50; opacity: 0.3; }
      100% { r: 35; opacity: 0.1; }
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -40;
      }
    }
    .cloud {
      animation: float 4s infinite ease-in-out;
      fill: #a5f3fc;
    }
    .pulse-ring {
      animation: pulseCircle 3s infinite ease-in-out;
      fill: none;
      stroke: #06b6d4;
      stroke-width: 2;
    }
    .sync-line {
      stroke: #0891b2;
      stroke-dasharray: 6 4;
      animation: dash 2s infinite linear;
    }
    .server {
      fill: #334155;
    }
    .led {
      fill: #10b981;
      animation: float 2s infinite ease-in-out;
    }
    .text {
      font-family: 'JetBrains Mono', monospace, Courier;
      font-size: 13px;
      fill: #0891b2;
      font-weight: bold;
    }
  </style>

  <!-- Pulsing cloud rings -->
  <circle cx="200" cy="70" r="40" class="pulse-ring" />

  <!-- Cloud Body -->
  <path d="M160 85 a 20 20 0 0 1 20 -20 a 30 30 0 0 1 50 -10 a 25 25 0 0 1 30 20 a 20 20 0 0 1 -10 39 h -80 a 20 20 0 0 1 -10 -29 z" class="cloud" />

  <!-- Connecting Sync Lines -->
  <path d="M120 135 L 180 85" class="sync-line" stroke-width="2" fill="none" />
  <path d="M280 135 L 220 85" class="sync-line" stroke-width="2" fill="none" />
  <path d="M200 135 L 200 90" class="sync-line" stroke-width="2" fill="none" />

  <!-- Local Server Nodes -->
  <!-- Left node -->
  <rect x="100" y="130" width="40" height="20" rx="3" class="server" />
  <circle cx="108" cy="140" r="2" class="led" />
  <circle cx="116" cy="140" r="2" class="led" style="animation-delay: 0.5s;" />

  <!-- Center node -->
  <rect x="180" y="130" width="40" height="20" rx="3" class="server" />
  <circle cx="188" cy="140" r="2" class="led" style="animation-delay: 0.2s;" />
  <circle cx="196" cy="140" r="2" class="led" style="animation-delay: 0.7s;" />

  <!-- Right node -->
  <rect x="260" y="130" width="40" height="20" rx="3" class="server" />
  <circle cx="268" cy="140" r="2" class="led" style="animation-delay: 0.4s;" />
  <circle cx="276" cy="140" r="2" class="led" style="animation-delay: 0.9s;" />

  <!-- Loading text -->
  <text x="200" y="180" class="text" text-anchor="middle">SYNCING CLOUD RESOURCES...</text>
</svg>
