<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <style>
    @keyframes blinkCursor {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    @keyframes requestBeam {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -20; }
    }
    .cursor {
      animation: blinkCursor 1s infinite steps(2);
      fill: #059669;
    }
    .beam {
      stroke-dasharray: 6 4;
      animation: requestBeam 2s infinite linear;
    }
    .text-code {
      font-family: 'JetBrains Mono', monospace, Courier;
      font-size: 11px;
      fill: #f1f5f9;
    }
    .text-loading {
      font-family: 'JetBrains Mono', monospace, Courier;
      font-size: 13px;
      fill: #059669;
      font-weight: bold;
    }
  </style>

  <!-- IDE Window Body -->
  <rect x="40" y="30" width="320" height="120" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  
  <!-- Header Bar -->
  <path d="M 40 38 A 8 8 0 0 1 48 30 H 352 A 8 8 0 0 1 360 38 V 50 H 40 Z" fill="#1e293b" />
  <circle cx="56" cy="40" r="3.5" fill="#ef4444" />
  <circle cx="68" cy="40" r="3.5" fill="#f59e0b" />
  <circle cx="80" cy="40" r="3.5" fill="#10b981" />
  <text x="200" y="44" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">main.py</text>

  <!-- Code editor mockups -->
  <text x="60" y="70" class="text-code">
    <tspan fill="#f43f5e">@app</tspan>.<tspan fill="#3b82f6">get</tspan>(<tspan fill="#10b981">"/api/v1/projects"</tspan>)
  </text>
  <text x="60" y="90" class="text-code">
    <tspan fill="#f43f5e">async def</tspan> <tspan fill="#8b5cf6">read_projects</tspan>():
  </text>
  <text x="80" y="110" class="text-code">
    <tspan fill="#f43f5e">return</tspan> await db.<tspan fill="#eab308">fetch_all</tspan>()
  </text>

  <!-- Pulsing cursor at the end of code -->
  <rect x="252" y="98" width="6" height="13" class="cursor" />

  <!-- Code compiler status beam -->
  <path d="M 40 148 L 360 148" class="beam" stroke="#059669" stroke-width="3" />

  <!-- Loading text -->
  <text x="200" y="180" class="text-loading" text-anchor="middle">INITIALIZING FASTAPI ROUTER...</text>
</svg>