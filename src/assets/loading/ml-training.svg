<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <style>
    @keyframes fitLine {
      0% { x2: 120; y2: 130; }
      50% { x2: 300; y2: 60; }
      100% { x2: 120; y2: 130; }
    }
    @keyframes pulseNode {
      0% { r: 4; opacity: 0.6; }
      50% { r: 7; opacity: 1; fill: #e06666; }
      100% { r: 4; opacity: 0.6; }
    }
    @keyframes sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .regression-line {
      animation: fitLine 4s infinite ease-in-out;
    }
    .data-node {
      animation: pulseNode 2s infinite ease-in-out;
    }
    .node-delay-1 { animation-delay: 0.3s; }
    .node-delay-2 { animation-delay: 0.6s; }
    .node-delay-3 { animation-delay: 0.9s; }
    .node-delay-4 { animation-delay: 1.2s; }
    
    .radar {
      transform-origin: 200px 90px;
      animation: sweep 4s infinite linear;
    }
    .grid-line {
      stroke: #e2e8f0;
      stroke-dasharray: 4 4;
    }
    .text {
      font-family: 'JetBrains Mono', monospace, Courier;
      font-size: 13px;
      fill: #3b82f6;
      font-weight: bold;
    }
  </style>

  <!-- Plot Background Grid -->
  <line x1="80" y1="40" x2="320" y2="40" class="grid-line" stroke-width="1" />
  <line x1="80" y1="90" x2="320" y2="90" class="grid-line" stroke-width="1" />
  <line x1="80" y1="140" x2="320" y2="140" class="grid-line" stroke-width="1" />
  
  <line x1="140" y1="30" x2="140" y2="150" class="grid-line" stroke-width="1" />
  <line x1="200" y1="30" x2="200" y2="150" class="grid-line" stroke-width="1" />
  <line x1="260" y1="30" x2="260" y2="150" class="grid-line" stroke-width="1" />

  <!-- Plot Axes -->
  <line x1="80" y1="30" x2="80" y2="150" stroke="#94a3b8" stroke-width="2" />
  <line x1="80" y1="150" x2="330" y2="150" stroke="#94a3b8" stroke-width="2" />

  <!-- Data Scatter Points -->
  <circle cx="110" cy="130" r="5" class="data-node node-delay-1" fill="#3b82f6" />
  <circle cx="130" cy="115" r="5" class="data-node node-delay-3" fill="#3b82f6" />
  <circle cx="160" cy="120" r="5" class="data-node node-delay-2" fill="#3b82f6" />
  <circle cx="170" cy="95" r="5" class="data-node node-delay-4" fill="#3b82f6" />
  <circle cx="210" cy="100" r="5" class="data-node node-delay-1" fill="#3b82f6" />
  <circle cx="230" cy="75" r="5" class="data-node node-delay-3" fill="#3b82f6" />
  <circle cx="250" cy="85" r="5" class="data-node node-delay-2" fill="#3b82f6" />
  <circle cx="280" cy="60" r="5" class="data-node node-delay-4" fill="#3b82f6" />
  <circle cx="300" cy="50" r="5" class="data-node node-delay-1" fill="#3b82f6" />

  <!-- Linear Regression Line -->
  <line x1="90" y1="140" x2="300" y2="60" class="regression-line" stroke="#10b981" stroke-width="3" stroke-linecap="round" />

  <!-- Sweep line (represents scanning/learning) -->
  <line x1="200" y1="90" x2="200" y2="20" class="radar" stroke="rgba(59, 130, 246, 0.15)" stroke-width="2" />

  <!-- Legend / Loading Text -->
  <text x="200" y="180" class="text" text-anchor="middle">OPTIMIZING LOSS FUNCTION...</text>
</svg>
