<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <style>
    @keyframes transferLeft {
      0% { cx: 270; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 130; opacity: 0; }
    }
    @keyframes transferRight {
      0% { cx: 130; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 270; opacity: 0; }
    }
    @keyframes pulseServer {
      0%, 100% { fill: #1e293b; }
      50% { fill: #334155; }
    }
    .data-to-server {
      animation: transferLeft 2s infinite ease-in-out;
    }
    .data-to-client {
      animation: transferRight 2s infinite ease-in-out;
      animation-delay: 1s;
    }
    .server-rack {
      animation: pulseServer 3s infinite ease-in-out;
    }
    .text {
      font-family: 'JetBrains Mono', monospace, Courier;
      font-size: 13px;
      fill: #2563eb;
      font-weight: bold;
    }
  </style>

  <!-- Server Rack representation (Right side) -->
  <g transform="translate(270, 45)">
    <rect x="0" y="0" width="70" height="90" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
    
    <!-- Rack Server 1 -->
    <rect x="5" y="10" width="60" height="18" rx="2" class="server-rack" />
    <circle cx="15" cy="19" r="2.5" fill="#10b981" />
    <circle cx="23" cy="19" r="2.5" fill="#3b82f6" />
    <line x1="50" y1="19" x2="60" y2="19" stroke="#64748b" stroke-width="2" />

    <!-- Rack Server 2 -->
    <rect x="5" y="36" width="60" height="18" rx="2" class="server-rack" style="animation-delay: 0.5s;" />
    <circle cx="15" cy="45" r="2.5" fill="#10b981" />
    <circle cx="23" cy="45" r="2.5" fill="#ef4444" />
    <line x1="50" y1="45" x2="60" y2="45" stroke="#64748b" stroke-width="2" />

    <!-- Rack Server 3 -->
    <rect x="5" y="62" width="60" height="18" rx="2" class="server-rack" style="animation-delay: 1s;" />
    <circle cx="15" cy="71" r="2.5" fill="#10b981" />
    <circle cx="23" cy="71" r="2.5" fill="#3b82f6" />
    <line x1="50" y1="71" x2="60" y2="71" stroke="#64748b" stroke-width="2" />
  </g>

  <!-- Client Browser (Left side) -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="70" height="80" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <!-- Browser Header Bar -->
    <rect x="0" y="0" width="70" height="15" rx="3" fill="#334155" />
    <circle cx="8" cy="8" r="2" fill="#ef4444" />
    <circle cx="15" cy="8" r="2" fill="#f59e0b" />
    <circle cx="22" cy="8" r="2" fill="#10b981" />
    <!-- Browser content lines -->
    <rect x="8" y="25" width="54" height="6" rx="1" fill="#475569" />
    <rect x="8" y="38" width="40" height="6" rx="1" fill="#475569" />
    <rect x="8" y="51" width="48" height="6" rx="1" fill="#475569" />
  </g>

  <!-- Connection line -->
  <line x1="130" y1="90" x2="270" y2="90" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Data Flowing back and forth -->
  <!-- Request to Server -->
  <circle cx="130" cy="85" r="5" fill="#3b82f6" class="data-to-server" />
  
  <!-- Response to Client -->
  <circle cx="270" cy="95" r="5" fill="#10b981" class="data-to-client" />

  <text x="200" y="175" class="text" text-anchor="middle">RESOLVING API REQUESTS...</text>
</svg>