<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <style>
    @keyframes requestFlow {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes gatewayPulse {
      0% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.05); filter: brightness(1.2); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    .request-dot {
      animation: requestFlow 3s infinite linear;
    }
    .gateway {
      transform-origin: 200px 90px;
      animation: gatewayPulse 2s infinite ease-in-out;
      fill: #8b5cf6;
    }
    .service-box {
      fill: #1e293b;
      stroke: #475569;
      stroke-width: 2;
    }
    .text {
      font-family: 'JetBrains Mono', monospace, Courier;
      font-size: 13px;
      fill: #8b5cf6;
      font-weight: bold;
    }
  </style>

  <!-- Paths for request dots -->
  <path id="path-left" d="M 50 90 L 175 90" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 4" />
  <path id="path-top" d="M 200 90 L 320 50" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 4" />
  <path id="path-mid" d="M 200 90 L 320 90" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 4" />
  <path id="path-bottom" d="M 200 90 L 320 130" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Request Dots flowing -->
  <circle r="5" fill="#f43f5e" class="request-dot">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 50 90 L 175 90" />
  </circle>
  <circle r="4" fill="#10b981" class="request-dot" style="animation-delay: 0.8s;">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 50 90 L 175 90" />
  </circle>

  <circle r="4" fill="#3b82f6" class="request-dot">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 200 90 L 320 50" />
  </circle>
  <circle r="4" fill="#f59e0b" class="request-dot" style="animation-delay: 0.5s;">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 200 90 L 320 90" />
  </circle>
  <circle r="4" fill="#ef4444" class="request-dot" style="animation-delay: 1s;">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M 200 90 L 320 130" />
  </circle>

  <!-- Client Node -->
  <circle cx="50" cy="90" r="10" fill="#64748b" />
  <text x="50" y="115" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">CLIENT</text>

  <!-- API Gateway Node (Hexagon shape) -->
  <polygon points="200,70 220,80 220,100 200,110 180,100 180,80" class="gateway" />
  <text x="200" y="94" font-family="sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">API</text>

  <!-- Microservices (Backend nodes) -->
  <rect x="320" y="38" width="50" height="24" rx="4" class="service-box" />
  <text x="345" y="54" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">AUTH</text>

  <rect x="320" y="78" width="50" height="24" rx="4" class="service-box" />
  <text x="345" y="94" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">DATA</text>

  <rect x="320" y="118" width="50" height="24" rx="4" class="service-box" />
  <text x="345" y="134" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">MAIL</text>

  <!-- Loading text -->
  <text x="200" y="180" class="text" text-anchor="middle">ROUTING API REQUESTS...</text>
</svg>
